name: Man Ak Bae CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manakbae_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        working-directory: ./backend
        env:
          SECRET_KEY: test-key-for-github-actions
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/manakbae_test_db
        run: |
          python manage.py check

      - name: Verify Migrations
        working-directory: ./backend
        env:
          SECRET_KEY: test-key-for-github-actions
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/manakbae_test_db
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          SECRET_KEY: test-key-for-github-actions
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/manakbae_test_db
        run: |
          pytest

  mobile-check:
    name: Mobile Expo Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Check Expo Config
        working-directory: ./mobile
        run: |
          npx expo config --type public

