services:
  - type: web
    name: man-ak-bae
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_games && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TIME_ZONE
        value: "Africa/Dakar"
      - key: DATABASE_URL
        fromDatabase:
          name: manakbae-db
          property: connectionString

databases:
  - name: manakbae-db
    databaseName: manakbae_db
    user: postgres
    plan: free
