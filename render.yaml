services:
  - type: web
    name: man-ak-bae
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_games && python manage.py ensure_admin && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TIME_ZONE
        value: "Africa/Dakar"
      # Colle ici l'URL PostgreSQL permanente de Neon (https://neon.tech) ou Supabase
      # (Évite la base gratuite Render qui expire après 30 jours)
      - key: DATABASE_URL
        sync: false
      # Ajoute l'URL de ton frontend Vercel/Cloudflare Pages si tu utilises un domaine personnalisé
      - key: CORS_ALLOWED_ORIGINS
        sync: false
